<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14232A">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<title>Sunfood — sem conexão</title>
<style>
/* Design system (2026-10-07): medidas reais, sem zoom geral. */

  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#F7F5F0;font-family:'Manrope',system-ui,sans-serif;color:#14232A;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:340px}
  h1{font-size:26px;line-height:1.1;margin:16px 0 8px;color:#14232A}
  p{font-size:15px;line-height:1.5;margin:0 0 24px;color:#55626A}
  button{font:700 16px 'Manrope',system-ui,sans-serif;background:#1F5A63;color:#fff;border:0;border-radius:14px;min-height:52px;padding:0 24px;cursor:pointer}
  h1{font-weight:800;letter-spacing:-.02em}
</style>
</head>
<body>
<div class="box">
  <img src="icons/icon-192.png" width="88" height="88" alt="">
  <h1>Você está sem internet</h1>
  <p>Para ver o cardápio e fazer pedidos, o Sunfood precisa de conexão. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</div>
</body>
</html>
