<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1B33">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<title>Sunfood — sem conexão</title>
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#FFF6EC;font-family:Inter,system-ui,sans-serif;color:#1B2430;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:340px}
  h1{font-size:22px;margin:18px 0 8px;color:#0F1B33}
  p{font-size:15px;line-height:1.5;margin:0 0 22px;color:#4A5568}
  button{font:600 15px Inter,system-ui,sans-serif;background:#FF6B35;color:#fff;border:0;border-radius:12px;padding:13px 26px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="icons/icon-192.png" width="88" height="88" alt="">
  <h1>Você está sem internet</h1>
  <p>Para ver o cardápio e fazer pedidos, o Sunfood precisa de conexão. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</div>
</body>
</html>
