<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2A30">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<title>Sunfood — sem conexão</title>
<style>
/* Escala geral: tudo um pouco menor que o tamanho "cru" do CSS, para as telas
   não parecerem ampliadas (pedido do Dárlley, 2026-10-06). As alturas de tela
   cheia usam calc(100vh / var(--sfz)) porque o zoom também encolhe o vh.
   No celular e no tablet os campos ficam com 16px reais na tela, senão o
   iPhone dá zoom sozinho ao tocar num campo. */
:root{--sfz:.86}
@media (max-width:1100px){:root{--sfz:.92}}
html{zoom:var(--sfz)}
@media (max-width:1100px){input,select,textarea{font-size:calc(16px / var(--sfz)) !important}}

  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#F6F3EC;font-family:'DM Sans',system-ui,sans-serif;color:#12232E;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:340px}
  h1{font-size:22px;margin:18px 0 8px;color:#0E2A30}
  p{font-size:15px;line-height:1.5;margin:0 0 22px;color:#5A6670}
  button{font:600 15px 'DM Sans',system-ui,sans-serif;background:#FFB21E;color:#12232E;border:0;border-radius:12px;padding:13px 26px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="icons/icon-192.png" width="88" height="88" alt="">
  <h1>Você está sem internet</h1>
  <p>Para ver o cardápio e fazer pedidos, o Sunfood precisa de conexão. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</div>
</body>
</html>
