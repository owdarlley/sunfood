<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E2A30">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunfood">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="./pwa.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#F6F3EC; -webkit-font-smoothing:antialiased; }
  a { color:#0B6670; text-decoration:none; }
  a:hover { color:#0B6670; }
</style>
</helmet>

<div style="font-family:'DM Sans',sans-serif;color:#12232E;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(165deg,#0E3A40 0%,#0B6670 55%,#12808A 100%)">
  <div style="width:404px;max-width:100%;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 40px 80px -24px rgba(0,0,0,.6)">
    <div style="background:linear-gradient(165deg,#0E3A40 0%,#0B6670 40%,#FFB21E 100%);color:#fff;padding:26px 24px 22px;text-align:center">
      <div style="display:flex;align-items:center;justify-content:center;gap:9px">
        <svg viewBox="0 0 48 48" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" style="display:block"><path d="M16 24a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M24 6v5 M24 37v5 M6 24h5 M37 24h5 M11 11l3.5 3.5 M33.5 33.5 37 37 M37 11l-3.5 3.5 M14.5 33.5 11 37"></path></svg>
        <span style="font:800 23px 'Bricolage Grotesque',sans-serif">SUNFOOD</span>
      </div>
      <div style="font:500 12.5px 'DM Sans',sans-serif;color:rgba(255,255,255,.78);margin-top:5px">Redefinir senha</div>
    </div>

    <sc-if value="{{ tokenMissing }}" hint-placeholder-val="{{ false }}">
      <div style="padding:26px 24px;display:flex;flex-direction:column;gap:14px;text-align:center">
        <p style="font:400 13.5px/1.6 'DM Sans',sans-serif;color:#5A6670;margin:0">{{ invalidMsg }}</p>
        <a href="app-cliente.dc.html?module=cliente&amp;screen=forgot" style="background:#FFB21E;color:#12232E;border-radius:12px;padding:14px;text-align:center;font:700 15px 'Bricolage Grotesque',sans-serif">Pedir um novo link</a>
        <a href="./" style="text-align:center;font:600 12.5px 'DM Sans',sans-serif">Voltar ao login</a>
      </div>
    </sc-if>

    <sc-if value="{{ hasToken }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div style="padding:26px 24px;display:flex;flex-direction:column;gap:14px;text-align:center">
          <p style="font:400 13.5px/1.6 'DM Sans',sans-serif;color:#5A6670;margin:0">Senha redefinida com sucesso. Já dá pra entrar com a nova senha.</p>
          <a href="./" style="background:#FFB21E;color:#12232E;border-radius:12px;padding:14px;text-align:center;font:700 15px 'Bricolage Grotesque',sans-serif">Ir para o login</a>
        </div>
      </sc-if>
      <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
        <div style="padding:24px;display:flex;flex-direction:column;gap:14px">
          <div>
            <span style="display:block;font:600 10.5px 'DM Sans',sans-serif;color:#5A6670;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Nova senha</span>
            <input type="password" value="{{ newPass }}" onChange="{{ setNewPass }}" placeholder="Mínimo 6 caracteres" style="width:100%;box-sizing:border-box;border:1.5px solid #E3DDD0;border-radius:12px;padding:12px 13px;font:400 14px 'DM Sans',sans-serif;outline:none" style-focus="border-color:#0B6670">
          </div>
          <div>
            <span style="display:block;font:600 10.5px 'DM Sans',sans-serif;color:#5A6670;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Confirmar nova senha</span>
            <input type="password" value="{{ confirmPass }}" onChange="{{ setConfirmPass }}" placeholder="Repita a senha" style="width:100%;box-sizing:border-box;border:1.5px solid #E3DDD0;border-radius:12px;padding:12px 13px;font:400 14px 'DM Sans',sans-serif;outline:none" style-focus="border-color:#0B6670">
          </div>
          <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
            <div style="background:#FDECEA;color:#B42318;font:600 12px 'DM Sans',sans-serif;padding:9px 11px;border-radius:10px">⚠ {{ err }}</div>
          </sc-if>
          <div onClick="{{ submit }}" style="background:#FFB21E;color:#12232E;border-radius:12px;padding:14px;text-align:center;font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer" style-hover="background:#084C53">Redefinir senha</div>
        </div>
      </sc-if>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:520}}">
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8787'
  : 'https://sunfood-api-nine.vercel.app';

class Component extends DCLogic {
  state = { accessToken:null, expired:false, newPass:'', confirmPass:'', err:'', done:false };

  componentDidMount(){
    // O Supabase manda o token de recuperação no fragmento da URL
    // (#access_token=...&type=recovery), não como query string.
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const token = hash.get('access_token');
    if(hash.get('type') === 'recovery' && token) this.setState({accessToken:token});
    else if(hash.get('error_code') === 'otp_expired') this.setState({expired:true});
    // Tira o token da barra de endereço: não deve ficar no histórico do navegador.
    if(window.location.hash) history.replaceState(null, '', window.location.pathname);
  }

  async submit(){
    const s = this.state;
    if(s.newPass.length < 6) return this.setState({err:'A senha deve ter ao menos 6 caracteres.'});
    if(s.newPass !== s.confirmPass) return this.setState({err:'As senhas não conferem.'});
    try {
      const res = await fetch(API_BASE + '/auth/update-password', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({accessToken:s.accessToken, newPassword:s.newPass})
      });
      const data = await res.json();
      if(!res.ok) return this.setState({err: data.error || 'Não foi possível redefinir a senha.'});
      this.setState({done:true, err:''});
    } catch(e){
      this.setState({err:'Falha de conexão com o servidor.'});
    }
  }

  renderVals(){
    const s = this.state;
    return {
      tokenMissing: !s.accessToken,
      hasToken: !!s.accessToken,
      invalidMsg: s.expired ? 'Este link expirou (vale por 1 hora). Peça um novo e use o mais recente que chegar no e-mail.'
        : 'Este link de redefinição é inválido ou já foi usado. Peça um novo para continuar.',
      newPass: s.newPass, confirmPass: s.confirmPass,
      setNewPass: e => this.setState({newPass:e.target.value, err:''}),
      setConfirmPass: e => this.setState({confirmPass:e.target.value, err:''}),
      err: s.err, hasErr: !!s.err,
      done: s.done,
      notDone: !s.done,
      submit: () => this.submit()
    };
  }
}
</script>
</body>
</html>
