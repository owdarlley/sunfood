# Roda os testes a cada push e pull request, pra pegar erro antes de chegar
# no site ou na API: as telas (navegador de verdade + API falsa) e o servidor.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  telas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          set +e
          for t in telas pagamentos senha conta google pwa mesas celular localizacao excluir-produto sessao relatorios desempenho responder-mensagens perfil; do
            node fluxo/$t.mjs > out-$t.txt 2>&1; echo "$t exit=$?"
            grep -E '^FALHA|Error|error' out-$t.txt | head -15 | sed "s/^/::error title=$t::/"
          done
          exit 0

  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
