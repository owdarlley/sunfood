# Gera o APK Android do SunFood (pasta android/) a cada mudança nela.
# A chave fica fora do repositório: com os segredos ANDROID_KEYSTORE_BASE64
# (sunfood-release.jks em base64) e ANDROID_KEYSTORE_PASSWORD cadastrados, o
# APK também sai alinhado e assinado (sunfood-assinado.apk); sem eles, só o
# APK sem assinatura.
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'
      - run: gradle -p android assembleRelease
      - name: Alinhar e assinar o APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KS_B64 != ''
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT=android/app/build/outputs/apk/release
          # Tira espaços e quebras de linha que vêm junto quando o segredo é colado.
          export KS_PW="$(printf %s "$KS_PW" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')"
          printf %s "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/sunfood.jks"
          "$BT/zipalign" -P 16 -f 4 "$OUT/app-release-unsigned.apk" "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/sunfood.jks" --ks-key-alias sunfood \
            --ks-pass env:KS_PW --key-pass env:KS_PW --out "$OUT/sunfood-assinado.apk" "$RUNNER_TEMP/alinhado.apk"
          rm -f "$RUNNER_TEMP/sunfood.jks" "$OUT"/*.idsig
          "$BT/apksigner" verify --print-certs "$OUT/sunfood-assinado.apk" | grep -i sha-256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunfood-apk
          path: android/app/build/outputs/apk/release/*.apk
      # Guarda o APK num ref fora das branches (refs/apk/<branch>), para baixar
      # com git onde o download de artifacts não está disponível.
      - name: Publicar APK em refs/apk
        run: |
          mkdir /tmp/apk && cp android/app/build/outputs/apk/release/*.apk /tmp/apk/
          cd /tmp/apk && git init -q && git add . \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK de ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/apk/${GITHUB_REF_NAME}"
