# Gera o APK Android do Sunfood (pasta android/) a cada mudança nela.
# O APK sai sem assinatura: a chave fica fora do repositório e a assinatura é
# feita à parte, com apksigner, antes de distribuir.
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p android assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunfood-apk-sem-assinatura
          path: android/app/build/outputs/apk/release/*.apk
      # Guarda o APK num ref fora das branches (refs/apk/<branch>), para baixar
      # com git onde o download de artifacts não está disponível.
      - name: Publicar APK em refs/apk
        run: |
          mkdir /tmp/apk && cp android/app/build/outputs/apk/release/*.apk /tmp/apk/
          cd /tmp/apk && git init -q && git add . \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK de ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/apk/${GITHUB_REF_NAME}"
